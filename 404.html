<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171326">
<meta name="robots" content="noindex,follow">
<title>Страница не найдена — Ну-ка, все вместе!</title>
<style>
:root{color-scheme:dark;--cream:#fff8ef;--muted:#d0c5d5;--gold:#f1c477;--purple:#b78acb}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:28px 20px;background:#171326;color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:-24px;z-index:-2;background:url("https://tvmag.ru/upload/iblock/a03/hw0423ryj2i.jpg") center 43%/cover no-repeat;filter:blur(18px) brightness(.28) saturate(1.2);transform:scale(1.08)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 18% 18%,#b85f7a55,transparent 38%),radial-gradient(ellipse at 84% 78%,#528f9b45,transparent 40%),linear-gradient(135deg,#171326bb,#21142dcc)}
main{width:min(680px,100%);text-align:center;padding:clamp(30px,7vw,68px) clamp(22px,6vw,58px);border:1px solid #ffffff32;border-radius:8px;background:linear-gradient(145deg,#ffffff13,#ffffff08);box-shadow:0 28px 90px #0006;backdrop-filter:blur(14px);animation:appear .7s both}
.brand{font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.number{margin:28px 0 2px;font:600 clamp(94px,22vw,160px)/.9 Georgia,"Times New Roman",serif;letter-spacing:-.07em;color:var(--cream);text-shadow:0 8px 38px #0006}
.rule{width:54px;height:3px;margin:27px auto;background:linear-gradient(90deg,var(--gold),var(--purple));border-radius:9px}
h1{margin:0;font:600 clamp(25px,5vw,39px)/1.15 Georgia,"Times New Roman",serif}
p{max-width:430px;margin:16px auto 30px;color:var(--muted);font-size:15px;line-height:1.7}
a{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 25px;border:1px solid var(--gold);border-radius:4px;background:linear-gradient(110deg,#e9b96c,#f2d59c);color:#2b2031;text-decoration:none;font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 26px #0003;transition:transform .2s,filter .2s,box-shadow .2s}
a:hover{transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 13px 32px #0005}
a:focus-visible{outline:2px solid white;outline-offset:4px}
.arrow{font-size:17px;line-height:1}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/assets/site-theme.css">
</head>
<body>
<main>
<div class="brand">Ну-ка, все вместе!</div>
<div class="number" aria-label="Ошибка 404">404</div>
<div class="rule"></div>
<h1>Страница не найдена</h1>
<p>Похоже, такой страницы не существует или она была перемещена. Но шоу продолжается — возвращайтесь на главную!</p>
<a href="/"><span>На главную</span><span class="arrow" aria-hidden="true">↗</span></a>
</main>
</body>
</html>
