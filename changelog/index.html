<!doctype html>
<html lang="ru">
<head>
<base href="/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e9">
<title>История изменений — Ну-ка, все вместе!</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');
:root{--ink:#251d25;--muted:#82777d;--paper:#f4f0e9;--card:#fffdf9;--wine:#71334b;--gold:#c49a58;--line:#e2d8ce}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#ead9d0 0,transparent 35%),var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
.page{width:min(900px,100%);margin:auto;padding:24px clamp(16px,4vw,42px) 70px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:-.04em;color:var(--ink)}.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--wine);color:white;font-size:20px}
.nav-link{padding:10px 14px;border:1px solid #cbb9b4;border-radius:99px;color:var(--wine);text-decoration:none;font-size:12px;font-weight:800}
.hero{padding:65px 0 30px}.eyebrow{color:var(--wine);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.hero h1{margin:14px 0;font:800 clamp(40px,7vw,68px)/1 'Manrope',sans-serif;letter-spacing:-.07em}.hero p{color:#71676c;line-height:1.7}
#changelog{display:grid;gap:18px}.release{padding:23px 25px;border:1px solid var(--line);border-radius:18px;background:#fffdf9d9;box-shadow:0 8px 24px #39212708}.release-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:15px}.release h2{margin:0;color:var(--wine);font:800 22px 'Manrope',sans-serif}.release-date{color:var(--muted);font-size:12px;font-weight:700}.release ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;color:#554b50;line-height:1.65}.release li{display:flex;align-items:flex-start;gap:10px}.change-tag{flex:0 0 auto;min-width:92px;padding:4px 7px;border-radius:7px;background:#f2e8e2;color:var(--wine);font-size:9px;font-weight:900;letter-spacing:.04em;text-align:center;text-transform:uppercase}
.state{padding:25px;border:1px dashed #cbb9b4;border-radius:15px;color:var(--muted);text-align:center}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:46px;padding-top:17px;border-top:1px solid var(--line);color:#93878b;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:560px){.hero{padding-top:43px}.release{padding:19px 17px}.release h2{font-size:19px}.release-head{align-items:flex-start;flex-direction:column;gap:5px}.release li{gap:7px}.change-tag{min-width:82px}.footer{font-size:8px}}
</style>
<script src="/maintenance-guard.js" defer></script>
</head>
<body><main class="page">
<nav class="nav"><a class="brand" href="/"><span class="brand-mark">♫</span><span>НУ-КА, ВСЕ ВМЕСТЕ!</span></a><a class="nav-link" href="/">← На главную</a></nav>
<header class="hero"><div class="eyebrow">Обновления проекта</div><h1>История изменений</h1><p>Здесь собраны заметные обновления сайта, новые возможности и исправления.</p></header>
<section id="changelog" aria-live="polite"><div class="state">Загружаем историю изменений…</div></section>
<footer class="footer"><span>История проекта</span><span>Ну-ка, все вместе!</span></footer>
</main>
<script>
(async()=>{const root=document.getElementById('changelog');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const response=await fetch('/CHANGELOG.md',{cache:'no-store'});if(!response.ok)throw new Error('Не удалось загрузить файл');const markdown=await response.text();const sections=markdown.split(/^##\\s+/m).slice(1);if(!sections.length)throw new Error('История пока пуста');root.innerHTML=sections.map(section=>{const lines=section.trim().split(/\\r?\\n/),heading=lines.shift().trim(),match=heading.match(/^Версия\\s+(.+?)\\s+[—–-]\\s+(.+)$/i),version=match?match[1]:heading,date=match?match[2]:'',items=lines.filter(line=>/^[-*]\\s+/.test(line)).map(line=>{const value=line.replace(/^[-*]\\s+/,''),tag=value.match(/^\\[(Добавлено|Исправлено|Изменено|Удалено)\\]\\s*(.*)$/i),type=tag?tag[1]:'Обновление',description=tag?tag[2]:value;return '<li><span class="change-tag">'+esc(type)+'</span><span>'+esc(description)+'</span></li>'}).join('');return '<article class="release"><div class="release-head"><h2>Версия '+esc(version)+'</h2><span class="release-date">'+esc(date)+'</span></div><ul>'+items+'</ul></article>'}).join('')}catch(error){root.innerHTML='<div class="state">Не удалось загрузить историю изменений. Попробуйте обновить страницу позже.</div>'}})();
</script>
</body></html>
