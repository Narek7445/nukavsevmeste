name: Generate SEO pages
on:
  push:
    branches: [main, seo/match-site-design]
    paths-ignore:
      - "contestants/*/index.html"
      - "articles/*/index.html"
      - "sitemap.xml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [participants-updated]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate static SEO pages
        run: node scripts/generate-seo-pages.mjs
      - name: Commit generated pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "SEO output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contestants articles sitemap.xml
          git commit -m "chore(seo): regenerate indexed content pages"
          # Retry safely if another workflow or maintainer updated main meanwhile.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; syncing with latest main (attempt $attempt/3)."
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            # SEO output may overlap with another generation; rebuild against latest main.
            git rebase --abort || true
            git reset --hard origin/main
            node scripts/generate-seo-pages.mjs
            git add contestants articles sitemap.xml
            if [ -z "$(git status --porcelain)" ]; then
              echo "Latest main already contains current SEO output."
              exit 0
            fi
            git commit -m "chore(seo): regenerate indexed content pages"
          done
          echo "Failed to push SEO updates after 3 attempts."
          exit 1
