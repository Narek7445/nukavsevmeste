name: Generate SEO pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "contestants/*/index.html"
      - "articles/*/index.html"
      - "sitemap.xml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate static SEO pages
        run: node scripts/generate-seo-pages.mjs
      - name: Commit generated pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "SEO output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contestants articles sitemap.xml
          git commit -m "chore(seo): regenerate indexed content pages"
          git push
