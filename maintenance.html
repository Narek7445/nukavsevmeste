<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Технические работы · Ну-ка, все вместе!</title>
<style>
:root{color-scheme:light;--wine:#542b3d;--gold:#b58b4b;--ink:#342832;--muted:#82747b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 15%,#f2e6d9 0,transparent 34%),radial-gradient(circle at 90% 85%,#eadde1 0,transparent 35%),#f8f4ee;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(680px,100%);padding:clamp(30px,7vw,66px);border:1px solid #e7d9ce;border-radius:30px;background:#fffdf9ed;box-shadow:0 30px 90px #3d253016;text-align:center}
.brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:#94734d;text-transform:uppercase}
.art{width:160px;height:160px;margin:28px auto 24px;display:grid;place-items:center;position:relative;border-radius:50%;background:linear-gradient(145deg,#fff5df,#f0e1cc);box-shadow:inset 0 0 0 1px #e6d4b9,0 14px 35px #76502a16}
.art:before,.art:after{content:"";position:absolute;border:1px dashed #c7a979;border-radius:50%;inset:12px}.art:after{inset:-9px;border-color:#dfd1c2}
.hammer{font-size:76px;filter:drop-shadow(0 8px 5px #5c3b3024);transform:rotate(-18deg)}
.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
h1{margin:12px 0 14px;color:var(--wine);font:600 clamp(30px,6vw,46px)/1.12 Georgia,serif}
p{max-width:470px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.8}
.rule{width:54px;height:3px;margin:26px auto;border-radius:4px;background:linear-gradient(90deg,#d7bd8e,#a97c43)}
.note{font-size:11px;letter-spacing:.08em;color:#a19491}
</style>
<link rel="stylesheet" href="/assets/site-theme.css">
</head>
<body>
<main class="card">
<div class="brand">Ну-ка, все вместе!</div>
<div class="art" aria-hidden="true"><span class="hammer">🔨</span></div>
<div class="eyebrow">Мы скоро вернёмся</div>
<h1>Сайт временно отключен</h1>
<p>Проводятся технические работы. Мы обновляем сайт, чтобы совсем скоро вернуться с улучшениями. Пожалуйста, загляните немного позже.</p>
<div class="rule"></div>
<div class="note">СПАСИБО ЗА ТЕРПЕНИЕ</div>
</main>

<script>
(async function () {
  try {
    const response = await fetch('https://api.nukavsevmeste.org/api/site-status', {
      method: 'GET',
      cache: 'no-store',
      credentials: 'omit',
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return;
    const status = await response.json();
    if (status && status.maintenance === false) {
      window.location.replace('/');
    }
  } catch (error) {
    // При недоступности API оставляем страницу доступной,
    // чтобы не создавать цикл или ложное перенаправление.
  }
})();
</script>
</body>
</html>
