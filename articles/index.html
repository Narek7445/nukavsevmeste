<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241c22"><title>Статьи — Ну-ка, все вместе!</title>
<meta name="description" content="Авторские статьи о шоу «Ну-ка, все вместе!»: участники, выступления, эксперты и история проекта.">
<link rel="icon" href="/favicon.svg">
<style>
:root{--burgundy:#361b2a;--wine:#59263c;--wine2:#8a4055;--gold:#c8a56a;--gold-light:#e7d1a4;--ink:#292328;--muted:#80767b;--paper:#fffdfa;--line:#e9e0d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f0eb;color:var(--ink);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.page{width:min(1280px,calc(100% - 52px));margin:auto;padding:20px 0 66px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9cec5}.brand{display:flex;align-items:center;gap:12px;color:var(--burgundy);text-decoration:none;font-size:12px;font-weight:950;letter-spacing:.14em}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--burgundy);color:var(--gold-light);font:25px Georgia,serif;box-shadow:0 5px 16px #361b2a25}.back,.share{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #d9cec5;border-radius:3px;background:transparent;color:var(--burgundy);text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transition:.2s}.back:hover{background:#fff}.hero{position:relative;overflow:hidden;margin:28px 0 30px;padding:clamp(34px,6vw,70px);border-radius:4px;background:radial-gradient(ellipse at 85% 20%,#794254 0,transparent 36%),linear-gradient(115deg,#2b1723,#51283b 68%,#38202e);color:#fff}.hero:after{content:"♫";position:absolute;right:5%;top:-34%;font:clamp(180px,30vw,360px)/1 Georgia,serif;color:#ffffff08;pointer-events:none}.eyebrow{position:relative;z-index:1;color:var(--gold-light);font-size:9px;font-weight:900;letter-spacing:.28em}.hero h1{position:relative;z-index:1;margin:13px 0 10px;color:#fff;font:600 clamp(42px,7vw,76px)/.98 Georgia,serif;letter-spacing:-.045em}.hero p{position:relative;z-index:1;max-width:610px;margin:0;color:#e4d9dd;font-size:14px;line-height:1.8}.article-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.article-card{display:flex;flex-direction:column;overflow:hidden;min-width:0;border:1px solid #e7ddd4;border-radius:4px;background:var(--paper);color:inherit;text-decoration:none;box-shadow:0 8px 25px #33202a0a;transition:transform .25s,box-shadow .25s}.article-card:hover{transform:translateY(-5px);box-shadow:0 18px 36px #33202a18}.article-card-cover,.article-card-placeholder{display:grid;width:100%;aspect-ratio:16/10;object-fit:cover;background:linear-gradient(135deg,#492337,#876071);color:#d8bd8e;place-items:center;font:58px Georgia,serif}.article-card-copy{flex:1;padding:21px 22px 22px}.article-card h2{margin:0 0 10px;color:var(--burgundy);font:600 25px/1.15 Georgia,serif;letter-spacing:-.02em}.article-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.article-date{display:block;margin-top:17px;padding-top:13px;border-top:1px solid var(--line);color:#a18d7d;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.empty,.error{padding:38px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--muted);text-align:center}.article-shell{max-width:980px;margin:30px auto 0;padding:clamp(24px,5vw,66px);border:1px solid #e8ded5;border-radius:4px;background:var(--paper);box-shadow:0 18px 55px #38222c0d}.article-cover{display:block;width:calc(100% + clamp(48px,10vw,132px));max-width:none;max-height:520px;object-fit:cover;margin:calc(-1 * clamp(24px,5vw,66px)) calc(-1 * clamp(24px,5vw,66px)) 36px}.article-title{margin:0 0 15px;color:var(--burgundy);font:600 clamp(36px,5.7vw,60px)/1.04 Georgia,serif;letter-spacing:-.04em}.article-summary{max-width:780px;margin:0 0 24px;color:#74656d;font:italic 19px/1.65 Georgia,serif}.article-meta{display:flex;align-items:center;gap:12px;padding:15px 0 20px;margin-bottom:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#a18d7d;font-size:9px;font-weight:900;letter-spacing:.16em}.article-meta:before{content:"";width:24px;height:2px;background:var(--gold)}.article-body{color:#393136;font:18px/1.9 Georgia,serif;overflow-wrap:anywhere}.article-body h2{margin:42px 0 15px;color:var(--burgundy);font:600 34px/1.15 Georgia,serif;letter-spacing:-.025em}.article-body h3{margin:32px 0 12px;color:var(--wine);font:600 26px/1.2 Georgia,serif}.article-body p{margin:0 0 22px}.article-body strong{color:#3c1c2c;font-weight:800}.article-body blockquote{margin:28px 0;padding:20px 25px;border-left:3px solid var(--gold);background:#f6f0e9;color:#6e5862;font-style:italic}.article-body a{color:var(--wine2);text-decoration-thickness:1px;text-underline-offset:4px}.article-body ul{padding-left:26px}.article-inline-image{margin:32px 0}.attachment-image{display:block;width:100%;max-height:520px;object-fit:contain;background:#eee8e2}.article-inline-image figcaption{margin-top:8px;color:var(--muted);font:italic 12px Georgia,serif}.stage-attachment{position:relative;isolation:isolate;display:block;overflow:hidden;min-height:280px;margin:30px 0;border-radius:4px;background:linear-gradient(135deg,#321a29,#7d4357);color:white;text-decoration:none;box-shadow:0 15px 32px #2c18252b}.stage-photo{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;transition:transform .5s}.stage-attachment:hover .stage-photo{transform:scale(1.035)}.stage-gradient{position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,rgba(17,10,15,.94) 0%,rgba(17,10,15,.53) 38%,rgba(17,10,15,.02) 100%)}.stage-content{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 30px;min-height:280px;padding:clamp(20px,4vw,34px)}.stage-person{display:grid;gap:4px;min-width:120px;color:#fff;text-shadow:0 2px 12px #000}.stage-person strong{font-size:clamp(17px,2vw,23px);font-weight:950;line-height:1.2}.stage-person b{color:#fff;font-size:clamp(22px,3vw,30px);font-weight:950;line-height:1}.stage-person b small{font-size:9px;letter-spacing:.16em}.stage-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#e1c48c;font:70px Georgia,serif}.attachment{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--burgundy);text-decoration:none}.attachment-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;background:#f3ece5;color:var(--wine);font-size:20px}.attachment small{display:block;color:var(--muted);font-size:11px}.attachment-reference{max-width:650px;margin:24px 0}.attachment-person-photo{width:82px;height:82px;flex:none;object-fit:cover}.attachment-reference>span:last-child{display:grid;gap:4px}.attachment-reference strong,.file-attachment strong{font:600 18px Georgia,serif}.share-row{display:flex;justify-content:flex-end;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}.share{border:0;border-radius:3px;background:var(--burgundy);color:#fff;cursor:pointer}.share:hover{background:var(--wine2)}.footer{margin-top:44px;padding-top:18px;border-top:1px solid #ddd2c9;text-align:center;color:#9b8e87;font-size:9px;letter-spacing:.08em}
@media(max-width:960px){.article-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{width:calc(100% - 24px);padding-top:10px}.top{height:58px}.brand{font-size:9px;letter-spacing:.1em}.brand-mark{width:36px;height:36px}.back{padding:8px 10px;font-size:9px}.hero{margin:18px 0 22px;padding:34px 23px}.hero h1{font-size:48px}.article-grid{grid-template-columns:1fr;gap:14px}.article-card h2{font-size:23px}.article-shell{margin-top:14px;padding:24px 17px}.article-cover{width:calc(100% + 34px);margin:-24px -17px 25px;max-height:300px}.article-title{font-size:38px}.article-summary{font-size:17px}.article-body{font-size:16px}.article-body h2{font-size:29px}.stage-attachment,.stage-content{min-height:230px}.stage-content{gap:13px;padding:19px}.stage-person strong{font-size:16px}.stage-person b{font-size:23px}.attachment-person-photo{width:65px;height:65px}}

.episode-attachment{margin:30px 0;padding:18px;border:1px solid #e4d8cd;border-radius:5px;background:linear-gradient(145deg,#fffdf9,#f7f0e9);box-shadow:0 12px 28px #2c182510}.episode-attachment-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:var(--burgundy);font:700 clamp(19px,2.2vw,25px)/1.25 Georgia,serif;text-decoration:none}.episode-attachment-title span{color:#a88a56;font:700 15px Arial,sans-serif}.episode-attachment-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:13px}.episode-attachment-person{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}.episode-attachment-person img,.episode-no-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;background:#e9ded4}.episode-no-photo{display:grid;place-items:center;color:#a88a56;font-size:30px}.episode-attachment-person strong{font:700 12px/1.3 Inter,Arial,sans-serif;color:var(--burgundy);overflow-wrap:anywhere}
@media(max-width:640px){.episode-attachment{padding:13px}.episode-attachment-people{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.episode-attachment-person strong{font-size:10px}}
.article-inline-image{display:block;margin:28px 0;padding:0;border:0;background:transparent}.article-inline-image .attachment-image{display:block;width:100%;height:auto;max-height:none;object-fit:contain;border-radius:10px}.article-inline-image figcaption{display:none}</style>
</head>
<body><main class="page">
<header class="top"><a class="brand" href="/"><span class="brand-mark">♫</span><span>НУ-КА, ВСЕ ВМЕСТЕ!</span></a><a class="back" href="/">← На главную</a></header>
<section class="hero" id="listHero"><div class="eyebrow">ИСТОРИИ · МНЕНИЯ · ВЫСТУПЛЕНИЯ</div><h1>Статьи</h1><p>Материалы о любимом шоу: участники, яркие номера, эксперты и события, которые хочется сохранить.</p></section>
<section id="content" aria-live="polite"><div class="empty">Загружаем публикации…</div></section>
<div class="footer">Фан-база шоу «Ну-ка, все вместе!» · Не является официальным сайтом проекта.</div>
</main>
<script>
(()=>{const API='https://api.nukavsevmeste.org',root=document.getElementById('content'),hero=document.getElementById('listHero'),id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentAttachments=[];function markdown(source){const inline=s=>esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');const out=[];let list=false;for(const line of String(source||'').split(/\r?\n/)){const t=line.trim(),marker=t.match(/^\{\{attachment:([a-zA-Z0-9-]+)\}\}$/);if(marker){if(list){out.push('</ul>');list=false}const item=currentAttachments.find(x=>x.id===marker[1]);if(item)out.push(attachmentMarkup(item));continue}if(!t){if(list){out.push('</ul>');list=false}continue}if(/^[-*]\s+/.test(t)){if(!list){out.push('<ul>');list=true}out.push('<li>'+inline(t.replace(/^[-*]\s+/,''))+'</li>');continue}if(list){out.push('</ul>');list=false}if(/^###\s+/.test(t))out.push('<h3>'+inline(t.replace(/^###\s+/,''))+'</h3>');else if(/^##\s+/.test(t))out.push('<h2>'+inline(t.replace(/^##\s+/,''))+'</h2>');else if(/^>\s?/.test(t))out.push('<blockquote>'+inline(t.replace(/^>\s?/,''))+'</blockquote>');else out.push('<p>'+inline(t)+'</p>')}if(list)out.push('</ul>');return out.join('')}
function attachmentMarkup(a){if(a.type==='image')return '<figure class="article-inline-image"><img class="attachment-image" src="'+esc(a.url)+'" alt="" loading="lazy"></figure>';if(a.type==='file')return '<a class="attachment file-attachment" href="'+esc(a.url)+'" target="_blank" rel="noopener"><span class="attachment-icon">↧</span><span><strong>'+esc(a.name)+'</strong><small>Открыть прикреплённый файл</small></span></a>';const href=a.href&&a.href.startsWith('/')?a.href:(a.type==='event'?'/#eventCountdown':'/seasons/');if(a.type==='episode'){const people=Array.isArray(a.performers)?a.performers:[];return '<section class="episode-attachment"><a class="episode-attachment-title" href="'+esc(href)+'">'+esc(a.name||'Выпуск')+' <span>↗</span></a><div class="episode-attachment-people">'+people.map(x=>'<div class="episode-attachment-person">'+(x.photo?'<img src="'+esc(x.photo)+'" alt="" loading="lazy">':'<span class="episode-no-photo">♫</span>')+'<strong>'+esc(x.name||'Участник')+'</strong></div>').join('')+'</div></section>'}if(a.type==='performance'){const people=Array.isArray(a.performers)&&a.performers.length?a.performers:[{name:a.name,score:a.score,song:a.song}];return '<a class="stage-attachment" href="'+esc(href)+'">'+(a.photo?'<img class="stage-photo" src="'+esc(a.photo)+'" alt="" loading="lazy">':'<span class="stage-placeholder">♫</span>')+'<span class="stage-gradient"></span><span class="stage-content">'+people.map(x=>'<span class="stage-person"><strong>'+esc(x.name)+'</strong>'+(x.score!==''&&x.score!=null?'<b>'+esc(x.score)+' <small>БАЛЛОВ</small></b>':'')+'</span>').join('')+'</span></a>'}return '<a class="attachment attachment-reference" href="'+esc(href)+'">'+(a.photo?'<img class="attachment-person-photo" src="'+esc(a.photo)+'" alt="'+esc(a.name)+'" loading="lazy">':'<span class="attachment-icon">'+(a.type==='profile'?'♙':a.type==='event'?'✦':'▤')+'</span>')+'<span><strong>'+esc(a.name)+'</strong><small>'+esc(a.details||'Материал архива')+'</small></span></a>'}
function date(s){if(!s)return '';const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
async function load(){try{if(id){const r=await fetch(API+'/api/articles?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Статья не найдена.');const a=d.article;currentAttachments=Array.isArray(a.attachments)?a.attachments:[];document.title=a.title+' — Статьи';hero.hidden=true;root.innerHTML='<article class="article-shell">'+(a.coverImage?'<img class="article-cover" src="'+esc(a.coverImage)+'" alt="">':'')+'<h1 class="article-title">'+esc(a.title)+'</h1>'+(a.summary?'<p class="article-summary">'+esc(a.summary)+'</p>':'')+'<div class="article-meta">ОПУБЛИКОВАНО '+esc(date(a.publishedAt||a.createdAt).toLocaleUpperCase('ru'))+'</div><div class="article-body">'+markdown(a.content)+'</div>'+(a.attachments?.some(x=>!x.id||!String(a.content||'').includes('{{attachment:'+x.id+'}}'))?'<section class="article-attachments"><h2>Дополнительные материалы</h2>'+a.attachments.filter(x=>!x.id||!String(a.content||'').includes('{{attachment:'+x.id+'}}')).map(attachmentMarkup).join('')+'</section>':'')+'<div class="share-row"><button class="share" id="shareArticle">Поделиться статьёй ↗</button></div></article>';document.getElementById('shareArticle').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('shareArticle').textContent='Ссылка скопирована ✓'}catch{prompt('Скопируйте ссылку:',location.href)}});return}
const r=await fetch(API+'/api/articles',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Не удалось загрузить статьи.');const articles=Array.isArray(d.articles)?d.articles:[];root.innerHTML=articles.length?'<div class="article-grid">'+articles.map(a=>'<a class="article-card" href="/articles/?id='+encodeURIComponent(a.slug)+'" style="color:inherit;text-decoration:none">'+(a.coverImage?'<img class="article-card-cover" src="'+esc(a.coverImage)+'" alt="" loading="lazy">':'')+'<div class="article-card-copy"><h2>'+esc(a.title)+'</h2><p>'+esc(a.summary||'')+'</p><span class="article-date">'+esc(date(a.publishedAt||a.createdAt))+'</span></div></a>').join('')+'</div>':'<div class="empty">Пока нет опубликованных статей. Загляните позже — здесь появятся новые материалы.</div>';
}catch(e){root.innerHTML='<div class="error">'+esc(e.message||'Не удалось загрузить страницу.')+'</div>'}}
load()})();
</script>
</body></html>
