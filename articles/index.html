<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241c22"><title>Статьи — Ну-ка, все вместе!</title>
<meta name="description" content="Авторские статьи о шоу «Ну-ка, все вместе!»: участники, выступления, эксперты и история проекта.">
<link rel="icon" href="/favicon.svg">
<style>
:root{--wine:#4d1e30;--wine2:#762f45;--gold:#c5a36a;--ink:#30272b;--muted:#82777b;--paper:#fffdf9;--line:#e7ddd3}
*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.page{width:min(1240px,calc(100% - 48px));margin:auto;padding:22px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 0 18px;border-bottom:1px solid #d8c9bf}.brand{display:flex;align-items:center;gap:12px;color:var(--wine);text-decoration:none;font-weight:900;letter-spacing:.04em}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--wine);color:#fff;font:25px Georgia,serif;box-shadow:0 8px 20px #4d1e3028}.back,.share{padding:10px 16px;border:1px solid #d8c8bc;border-radius:8px;background:#fff;color:var(--wine);text-decoration:none;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.hero{padding:42px 0 26px}.eyebrow{color:#a27c4e;font-size:10px;font-weight:900;letter-spacing:.2em}.hero h1{margin:7px 0 8px;color:var(--wine);font:600 clamp(36px,5vw,54px)/1.04 Georgia,serif;letter-spacing:-.035em}.hero p{max-width:680px;margin:0;color:var(--muted);font-size:14px}.article-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.article-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 10px 30px #39212a0a;transition:transform .2s,box-shadow .2s}.article-card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #39212a18}.article-card-cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee4dc}.article-card-copy{padding:18px 19px 20px}.article-card h2{margin:0 0 8px;color:var(--wine);font:600 22px/1.2 Georgia,serif}.article-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.article-date{display:block;margin-top:14px;color:#a18d7d;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.empty,.error{padding:30px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted);text-align:center}.article-shell{max-width:900px;margin:20px auto 0;padding:clamp(22px,4vw,48px);border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 16px 45px #39212a0c}.article-cover{width:100%;max-height:470px;object-fit:cover;border-radius:9px;margin-bottom:27px}.article-title{margin:0 0 12px;color:var(--wine);font:600 clamp(34px,5vw,50px)/1.1 Georgia,serif;letter-spacing:-.03em}.article-summary{margin:0 0 20px;color:var(--muted);font-size:17px;line-height:1.65}.article-meta{padding-bottom:18px;margin-bottom:25px;border-bottom:1px solid var(--line);color:#a18d7d;font-size:9px;font-weight:900;letter-spacing:.12em}.article-body{color:#392f32;font:17px/1.85 Georgia,serif;overflow-wrap:anywhere}.article-body h2{margin:34px 0 12px;color:var(--wine);font-size:29px;line-height:1.2}.article-body h3{margin:27px 0 10px;color:var(--wine);font-size:23px}.article-body p{margin:0 0 18px}.article-body blockquote{margin:22px 0;padding:15px 20px;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;background:#f7f0e8;color:#715d64}.article-body a{color:#8b3c57;text-decoration:underline;text-underline-offset:3px}.article-body ul{padding-left:24px}.article-attachments{display:grid;gap:12px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}.article-attachments h2{margin:0 0 4px;color:var(--wine);font:600 22px Georgia,serif}.attachment{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;color:var(--wine)}.attachment-image{display:block;width:100%;max-height:440px;object-fit:contain;border-radius:9px;background:#f5f0ea}.attachment-icon{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:9px;background:#f3ece4;color:var(--wine);font-size:19px}.attachment small{display:block;color:var(--muted);font-size:11px}.attachment-reference{max-width:620px}.attachment-person-photo{width:76px;height:76px;flex:none;object-fit:cover;border-radius:8px}.attachment-reference>span:last-child{display:grid;gap:4px}.attachment-reference strong{font:600 17px Georgia,serif}.share-row{display:flex;justify-content:flex-end;margin-top:28px}.share{border:0;background:var(--wine);color:#fff;cursor:pointer}.footer{margin-top:35px;text-align:center;color:#a2968e;font-size:10px;letter-spacing:.04em}
@media(max-width:900px){.article-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.page{width:calc(100% - 24px);padding-top:12px}.top{align-items:flex-start}.brand{font-size:11px}.brand-mark{width:38px;height:38px}.hero{padding:34px 0 22px}.article-grid{grid-template-columns:1fr}.article-shell{margin-top:12px;padding:21px 16px}.article-body{font-size:16px}.article-title{font-size:34px}.attachment-person-photo{width:62px;height:62px}}
</style>
</head>
<body><main class="page">
<header class="top"><a class="brand" href="/"><span class="brand-mark">♫</span><span>НУ-КА, ВСЕ ВМЕСТЕ!</span></a><a class="back" href="/">← На главную</a></header>
<section class="hero" id="listHero"><div class="eyebrow">ИСТОРИИ · МНЕНИЯ · ВЫСТУПЛЕНИЯ</div><h1>Статьи</h1><p>Материалы о любимом шоу: участники, яркие номера, эксперты и события, которые хочется сохранить.</p></section>
<section id="content" aria-live="polite"><div class="empty">Загружаем публикации…</div></section>
<div class="footer">Фан-база шоу «Ну-ка, все вместе!» · Не является официальным сайтом проекта.</div>
</main>
<script>
(()=>{const API='https://api.nukavsevmeste.org',root=document.getElementById('content'),hero=document.getElementById('listHero'),id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentAttachments=[];function markdown(source){const inline=s=>esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');const out=[];let list=false;for(const line of String(source||'').split(/\r?\n/)){const t=line.trim(),marker=t.match(/^\{\{attachment:([a-zA-Z0-9-]+)\}\}$/);if(marker){if(list){out.push('</ul>');list=false}const item=currentAttachments.find(x=>x.id===marker[1]);if(item)out.push(attachmentMarkup(item));continue}if(!t){if(list){out.push('</ul>');list=false}continue}if(/^[-*]\s+/.test(t)){if(!list){out.push('<ul>');list=true}out.push('<li>'+inline(t.replace(/^[-*]\s+/,''))+'</li>');continue}if(list){out.push('</ul>');list=false}if(/^###\s+/.test(t))out.push('<h3>'+inline(t.replace(/^###\s+/,''))+'</h3>');else if(/^##\s+/.test(t))out.push('<h2>'+inline(t.replace(/^##\s+/,''))+'</h2>');else if(/^>\s?/.test(t))out.push('<blockquote>'+inline(t.replace(/^>\s?/,''))+'</blockquote>');else out.push('<p>'+inline(t)+'</p>')}if(list)out.push('</ul>');return out.join('')}
function attachmentMarkup(a){if(a.type==='image')return '<img class="attachment-image" src="'+esc(a.url)+'" alt="'+esc(a.name)+'" loading="lazy">';if(a.type==='file')return '<div class="attachment"><span class="attachment-icon">↧</span><div><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.name)+'</a><small>Прикреплённый файл</small></div></div>';const href=a.href&&a.href.startsWith('/')?a.href:(a.type==='event'?'/#eventCountdown':'/seasons/');return '<a class="attachment attachment-reference" href="'+esc(href)+'">'+(a.photo?'<img class="attachment-person-photo" src="'+esc(a.photo)+'" alt="'+esc(a.name)+'" loading="lazy">':'<span class="attachment-icon">'+(a.type==='profile'?'♙':a.type==='performance'?'♫':a.type==='event'?'✦':'▤')+'</span>')+'<span><strong>'+esc(a.name)+'</strong><small>'+esc(a.details||'Материал архива')+'</small></span></a>'}
function date(s){if(!s)return '';const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
async function load(){try{if(id){const r=await fetch(API+'/api/articles?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Статья не найдена.');const a=d.article;currentAttachments=Array.isArray(a.attachments)?a.attachments:[];document.title=a.title+' — Статьи';hero.hidden=true;root.innerHTML='<article class="article-shell">'+(a.coverImage?'<img class="article-cover" src="'+esc(a.coverImage)+'" alt="">':'')+'<h1 class="article-title">'+esc(a.title)+'</h1>'+(a.summary?'<p class="article-summary">'+esc(a.summary)+'</p>':'')+'<div class="article-meta">ОПУБЛИКОВАНО '+esc(date(a.publishedAt||a.createdAt).toLocaleUpperCase('ru'))+'</div><div class="article-body">'+markdown(a.content)+'</div>'+(a.attachments?.some(x=>!x.id||!String(a.content||'').includes('{{attachment:'+x.id+'}}'))?'<section class="article-attachments"><h2>Дополнительные материалы</h2>'+a.attachments.filter(x=>!x.id||!String(a.content||'').includes('{{attachment:'+x.id+'}}')).map(attachmentMarkup).join('')+'</section>':'')+'<div class="share-row"><button class="share" id="shareArticle">Поделиться статьёй ↗</button></div></article>';document.getElementById('shareArticle').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('shareArticle').textContent='Ссылка скопирована ✓'}catch{prompt('Скопируйте ссылку:',location.href)}});return}
const r=await fetch(API+'/api/articles',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Не удалось загрузить статьи.');const articles=Array.isArray(d.articles)?d.articles:[];root.innerHTML=articles.length?'<div class="article-grid">'+articles.map(a=>'<a class="article-card" href="/articles/?id='+encodeURIComponent(a.slug)+'" style="color:inherit;text-decoration:none">'+(a.coverImage?'<img class="article-card-cover" src="'+esc(a.coverImage)+'" alt="" loading="lazy">':'')+'<div class="article-card-copy"><h2>'+esc(a.title)+'</h2><p>'+esc(a.summary||'')+'</p><span class="article-date">'+esc(date(a.publishedAt||a.createdAt))+'</span></div></a>').join('')+'</div>':'<div class="empty">Пока нет опубликованных статей. Загляните позже — здесь появятся новые материалы.</div>';
}catch(e){root.innerHTML='<div class="error">'+esc(e.message||'Не удалось загрузить страницу.')+'</div>'}}
load()})();
</script>
</body></html>
